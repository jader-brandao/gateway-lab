# Stack completo (app Nginx+PHP-FPM + worker + Postgres + Redis) — VPS / Hostinger / deploy.
# Publicar porta 80 no host: ficheiro docker-compose.hostports.yml (ver GETFY_COMPOSE_FILES em docker/up.sh).
# HTTPS na borda (VPS): docker-compose.prod.yml (Caddy + ACME).
# Desenvolvimento só com Laragon no host: use apenas Postgres + Redis:
#   .\docker\up-db.ps1   ou   docker compose -p gateway-lab-db -f docker-compose.local-db.yml up -d

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: getfy_app:latest
    pull_policy: never
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - getfy_storage:/var/www/html/storage
      - getfy_env:/var/www/html/.docker
    environment:
      APP_ENV: ${GETFY_APP_ENV:-local}
      APP_DEBUG: ${GETFY_APP_DEBUG:-true}
      GETFY_APP_URL: ${GETFY_APP_URL:-http://localhost}
      GETFY_WEBHOOK_PUBLIC_URL: ${GETFY_WEBHOOK_PUBLIC_URL:-}
      PORT: "80"
      APP_INSTALLED: ${GETFY_APP_INSTALLED:-true}
      APP_AUTO_MIGRATE: ${GETFY_APP_AUTO_MIGRATE:-false}
      DB_CONNECTION: ${GETFY_DB_CONNECTION:-pgsql}
      DB_HOST: ${GETFY_DB_HOST:-postgres}
      DB_PORT: ${GETFY_DB_PORT:-5432}
      DB_DATABASE: ${GETFY_DB_DATABASE:-getfy}
      DB_USERNAME: ${GETFY_DB_USERNAME:-getfy}
      DB_PASSWORD: ${GETFY_DB_PASSWORD:-getfy}
      REDIS_HOST: ${GETFY_REDIS_HOST:-redis}
      REDIS_PORT: ${GETFY_REDIS_PORT:-6379}
      CACHE_STORE: ${GETFY_CACHE_STORE:-redis}
      QUEUE_CONNECTION: ${GETFY_QUEUE_CONNECTION:-redis}
      SESSION_DRIVER: ${GETFY_SESSION_DRIVER:-file}
      GETFY_DOCKER: "true"
      GETFY_RUN_SETUP: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Sem variáveis $x — o Compose interpola $ no YAML e quebra o script PHP (WARN "The s variable is not set").
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/up >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 360s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${GETFY_DB_DATABASE:-getfy}
      POSTGRES_USER: ${GETFY_DB_USERNAME:-getfy}
      POSTGRES_PASSWORD: ${GETFY_DB_PASSWORD:-getfy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - "redis-server"
      - "--maxmemory"
      - "${GETFY_REDIS_MAXMEMORY:-128mb}"
      - "--maxmemory-policy"
      - "${GETFY_REDIS_MAXMEMORY_POLICY:-allkeys-lru}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  queue:
    image: getfy_app:latest
    pull_policy: never
    restart: unless-stopped
    command:
      - "sh"
      - "-lc"
      - "set -e; php artisan queue:work --sleep=3 --tries=3 --timeout=0 --memory=${GETFY_QUEUE_WORKER_MEMORY:-128} --max-time=${GETFY_QUEUE_WORKER_MAX_TIME:-3600} --max-jobs=${GETFY_QUEUE_WORKER_MAX_JOBS:-1000} & Q=$$!; php artisan schedule:work & S=$$!; trap 'kill $$Q $$S 2>/dev/null || true' INT TERM; while kill -0 $$Q 2>/dev/null && kill -0 $$S 2>/dev/null; do sleep 5; done; kill $$Q $$S 2>/dev/null || true; wait $$Q 2>/dev/null || true; wait $$S 2>/dev/null || true; exit 1"
    volumes:
      - getfy_storage:/var/www/html/storage
      - getfy_env:/var/www/html/.docker
    environment:
      APP_ENV: ${GETFY_APP_ENV:-local}
      APP_DEBUG: ${GETFY_APP_DEBUG:-true}
      GETFY_APP_URL: ${GETFY_APP_URL:-http://localhost}
      GETFY_WEBHOOK_PUBLIC_URL: ${GETFY_WEBHOOK_PUBLIC_URL:-}
      APP_INSTALLED: ${GETFY_APP_INSTALLED:-true}
      APP_AUTO_MIGRATE: ${GETFY_APP_AUTO_MIGRATE:-false}
      DB_CONNECTION: ${GETFY_DB_CONNECTION:-pgsql}
      DB_HOST: ${GETFY_DB_HOST:-postgres}
      DB_PORT: ${GETFY_DB_PORT:-5432}
      DB_DATABASE: ${GETFY_DB_DATABASE:-getfy}
      DB_USERNAME: ${GETFY_DB_USERNAME:-getfy}
      DB_PASSWORD: ${GETFY_DB_PASSWORD:-getfy}
      REDIS_HOST: ${GETFY_REDIS_HOST:-redis}
      REDIS_PORT: ${GETFY_REDIS_PORT:-6379}
      CACHE_STORE: ${GETFY_CACHE_STORE:-redis}
      QUEUE_CONNECTION: ${GETFY_QUEUE_CONNECTION:-redis}
      SESSION_DRIVER: ${GETFY_SESSION_DRIVER:-file}
      GETFY_DOCKER: "true"
      GETFY_RUN_SETUP: "false"
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  getfy_storage:
    driver: local
  getfy_env:
    driver: local
